<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3D4BFF">
<title>IQuick</title>
<style>
:root{
  --bg:#EEF2FF;--bg2:#F9FAFF;--surface:#FFFFFF;--ink:#101936;--muted:#5B6482;--brand:#3D4BFF;--brand2:#7A4DFF;--brand-d:#2531C9;--on-brand:#FFFFFF;
  --accent:#FFC93C;--star:#F2A900;--good:#14A06A;--bad:#E0445A;--track:#DDE3F3;--line:#CBD3EA;--shadow:0 8px 24px rgba(30,40,100,.10);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0B0F24;--bg2:#121733;--surface:#1A2040;--ink:#EEF1FF;--muted:#9AA3C7;--brand:#8794FF;--brand2:#B791FF;--brand-d:#5563D6;--on-brand:#0B0F24;--star:#FFC93C;--good:#3DD598;--bad:#FF6B81;--track:#2A3262;--line:#323B70;--shadow:0 8px 24px rgba(0,0,0,.4)}
}
:root[data-theme="dark"]{--bg:#0B0F24;--bg2:#121733;--surface:#1A2040;--ink:#EEF1FF;--muted:#9AA3C7;--brand:#8794FF;--brand2:#B791FF;--brand-d:#5563D6;--on-brand:#0B0F24;--star:#FFC93C;--good:#3DD598;--bad:#FF6B81;--track:#2A3262;--line:#323B70;--shadow:0 8px 24px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%) fixed;color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;font-size:18px;line-height:1.45;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;top:-18vmin;right:-22vmin;width:70vmin;height:70vmin;border-radius:50%;background:radial-gradient(circle,var(--brand) 0%,transparent 68%);opacity:.14;pointer-events:none}
body::after{content:"";position:fixed;bottom:-24vmin;left:-26vmin;width:76vmin;height:76vmin;border-radius:50%;background:radial-gradient(circle,var(--brand2) 0%,transparent 68%);opacity:.10;pointer-events:none}
main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:20px 18px 48px}
h1,h2,p{margin:0}
button{-webkit-tap-highlight-color:transparent}
#app>*{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
#app>*:nth-child(2){animation-delay:.04s}#app>*:nth-child(3){animation-delay:.08s}#app>*:nth-child(4){animation-delay:.12s}#app>*:nth-child(5){animation-delay:.16s}#app>*:nth-child(6){animation-delay:.2s}#app>*:nth-child(n+7){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(1.7);opacity:0}}
@keyframes starIn{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes glow{from{opacity:.7}to{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:44px;letter-spacing:-2px;line-height:1}
.logo svg{width:40px;height:40px;animation:bob 2.4s ease-in-out infinite}
.hero{margin:14px 0 18px}
.hero p{color:var(--muted);margin-top:6px;font-weight:600}
.hdr{display:flex;align-items:center;gap:10px}
.chipx{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:7px 12px;font-weight:800;font-size:16px;box-shadow:var(--shadow)}
.lead{font-size:26px;font-weight:900;line-height:1.15;letter-spacing:-.5px}
.lead.big{font-size:32px}
.sub{margin-top:10px;color:var(--muted)}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.facts{margin:18px 0;padding:0;list-style:none;display:grid;gap:8px}
.facts li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-size:16px;box-shadow:var(--shadow)}
.btn{display:block;font:inherit;font-weight:800;border:0;border-radius:16px;padding:16px 20px;width:100%;cursor:pointer;background:linear-gradient(135deg,var(--brand),var(--brand2));color:var(--on-brand);font-size:19px;margin-top:12px;box-shadow:0 5px 0 var(--brand-d),0 12px 22px rgba(61,75,255,.25);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--brand-d)}
.btn.alt,.btn.alt2{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.alt:active,.btn.alt2:active{box-shadow:0 1px 0 var(--line)}
.btn.sm{padding:12px 6px;font-size:16px;margin-top:0}
.btn:focus-visible,.opt:focus-visible,.card:focus-visible,.chip:focus-visible,.x:focus-visible,.inp:focus-visible,.prof:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px}
.x{font:inherit;font-size:18px;width:42px;height:42px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;flex:none}
.segs{flex:1;display:flex;gap:3px}
.segs i{flex:1;height:8px;border-radius:5px;background:var(--track)}
.segs i.ok{background:var(--good)}.segs i.no{background:var(--bad)}.segs i.cur{background:var(--brand)}
.clock{font-variant-numeric:tabular-nums;font-weight:900;color:var(--ink);font-size:20px;min-width:2.1em;text-align:center;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:3px 6px}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:var(--muted);font-weight:700;font-size:15px}
.combo{color:var(--star);font-weight:900}
.track{height:14px;background:var(--track);border-radius:10px;overflow:hidden;margin:10px 0 16px}
.fill{height:100%;width:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:10px;transform-origin:left center}
.fill.low{background:var(--bad)}
.qc{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.q{font-size:26px;font-weight:800;line-height:1.25;min-height:4.4em;overflow-wrap:anywhere}
.q small{display:block;margin-top:8px;font-size:17px;font-weight:600;color:var(--muted)}
.q .mono{font-size:38px;font-weight:800;display:block;margin:8px 0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.opts.off{visibility:hidden;pointer-events:none}
.opt{position:relative;font:inherit;font-weight:800;font-size:24px;padding:22px 8px 18px;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:16px;cursor:pointer;box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt .lt{position:absolute;left:8px;top:8px;width:20px;height:20px;border-radius:50%;background:var(--track);color:var(--muted);font-size:11px;font-weight:800;display:grid;place-items:center;font-style:normal}
.opt.mono{font-size:19px;letter-spacing:.06em}
.opt.good{border-color:var(--good);background:var(--good);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2);animation:pop .35s}
.opt.bad{border-color:var(--bad);background:var(--bad);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2);animation:shake .4s}
.opt.good .lt,.opt.bad .lt{background:rgba(255,255,255,.3);color:#fff}
.opt:disabled{cursor:default}
.opt svg{width:52px;height:52px;display:block;margin:0 auto}
.seq{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.mat{display:grid;grid-template-columns:repeat(3,56px);gap:6px;margin:6px 0 10px}
.cell{width:56px;height:56px;border:2px solid var(--line);border-radius:12px;background:var(--bg);display:grid;place-items:center;color:var(--ink)}
.cell svg{width:44px;height:44px}
.cell.qm{font-weight:800;font-size:24px;color:var(--muted)}
.ecgwrap{margin-top:18px}
#ecg,.strip{display:block;width:100%;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
#ecg{height:72px}
.strip{height:96px;margin-top:6px}
.strip.s{height:64px}
.cap{font-size:14px;color:var(--muted);margin-top:6px;font-weight:600}
.h2{font-size:20px;font-weight:800;margin:24px 0 10px}
.hero-card{background:linear-gradient(135deg,var(--brand),var(--brand2));color:var(--on-brand);border-radius:26px;padding:22px 20px;box-shadow:0 14px 30px rgba(61,75,255,.28);text-align:center;position:relative;overflow:hidden}
.hero-card::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero-card .eyebrow{color:inherit;opacity:.85}
.range{font-size:clamp(46px,16vw,76px);font-weight:900;letter-spacing:-2px;line-height:1;margin-top:10px;position:relative;white-space:nowrap}
.badge{display:inline-block;background:var(--accent);color:#1a1a1a;font-weight:900;border-radius:20px;padding:5px 16px;margin-top:12px;font-size:16px;position:relative}
.tier{font-size:19px;font-weight:800;margin-top:10px;position:relative}
.bars{display:grid;gap:14px;margin:20px 0}
.bar .lab{display:flex;justify-content:space-between;font-weight:700;color:var(--muted);margin-bottom:6px;font-size:16px}
.bar .t{height:14px;border-radius:8px;background:var(--track);overflow:hidden}
.bar .t i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#FF9F43);border-radius:8px}
.note{font-size:14px;color:var(--muted);margin:14px 0}
.toast{min-height:1.4em;text-align:center;color:var(--muted);font-size:15px;margin-top:8px}
.prof{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:7px 14px 7px 8px;cursor:pointer;box-shadow:var(--shadow);flex:1;font:inherit;color:var(--ink);text-align:left}
.prof small{display:block;color:var(--muted);font-size:13px;line-height:1.1}
.prof b{line-height:1.1}
.av{font-size:30px;line-height:1}
.av.big{font-size:64px;margin-bottom:8px}
.card{display:block;width:100%;text-align:left;font:inherit;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:20px;padding:14px 16px;margin-top:12px;cursor:pointer;box-shadow:var(--shadow);transition:transform .1s}
.card:active{transform:scale(.985)}
.card b{display:block;font-size:20px;line-height:1.2}
.card span{color:var(--muted);font-size:15px;line-height:1.3}
.card .cap b,.cap b{display:inline;font-size:inherit;color:var(--ink)}
.card.flat{cursor:default}
.card.flat:active{transform:none}
.card.row{display:flex;align-items:center;gap:14px}
.ic{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:26px;flex:none}
.ic.big{width:84px;height:84px;font-size:44px;border-radius:26px;margin:0 auto 12px}
.feat{display:grid;grid-template-columns:1fr 46%;gap:6px;align-items:center;border-color:transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(135deg,var(--brand),var(--brand2)) border-box;border:2px solid transparent}
.feat b{font-size:23px;letter-spacing:-.3px}
.feat small{display:block;color:var(--muted);font-size:13px;margin-top:6px;font-weight:600}
.go{display:inline-block;margin-top:12px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:var(--on-brand)!important;padding:8px 14px;border-radius:12px;font-weight:800;font-size:15px!important}
.mini{height:8px;background:var(--track);border-radius:6px;overflow:hidden;margin-top:10px}
.mini i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:6px}
.brain{display:block;width:100%;height:auto;overflow:visible}
.brain .rg{cursor:pointer}
.brain .hl .f{animation:glow .9s ease-in-out infinite alternate}
.bc{padding:12px 14px 10px;text-align:center}
.bc .cap{margin-top:4px;font-size:15px}
.inp{font:inherit;width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 18px}
.chip{font:inherit;font-size:20px;padding:8px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--line)}
.chip.on{border-color:var(--brand);background:var(--brand);color:var(--on-brand);box-shadow:0 3px 0 var(--brand-d)}
.center{text-align:center}
.center .facts{text-align:left}
.bar-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ttl{font-weight:900;font-size:22px;flex:1}
.pill{background:var(--accent);color:#1a1a1a;font-weight:900;border-radius:20px;padding:4px 12px;font-size:16px}
.pill.sm{font-size:14px;padding:3px 10px;flex:none}
.zn{margin-top:22px}
.zn.lk .reg{opacity:.6}
.reg{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--c);border-radius:20px;padding:12px 14px;box-shadow:var(--shadow)}
.reg .rt{flex:1;min-width:0}
.reg .rt b{display:block;font-size:18px;line-height:1.2}
.reg .rt span{color:var(--muted);font-size:14px;line-height:1.3;display:block}
.reg .mini{margin-top:6px;height:6px}
.path{display:block;width:100%;height:auto;margin-top:6px}
.nd{cursor:pointer;outline:none}
.nd.lock{cursor:default;opacity:.55}
.nc{fill:var(--surface);stroke:var(--line);stroke-width:4}
.nd.open .nc{stroke-width:5}
.nd.done .nc{stroke:none}
.nd:focus-visible .nc{stroke:var(--accent)}
.nt{font-size:18px;font-weight:900;fill:var(--ink);font-family:inherit}
.nd.lock .nt{font-size:15px}
.nd.done .nt{fill:#101936}
.ns{font-size:12px;fill:#101936;letter-spacing:0}
.ns .off{fill:#101936;fill-opacity:.25}
.pulse{animation:pulse 1.6s ease-out infinite;transform-origin:center;transform-box:fill-box}
.nd.open:hover .nc,.nd.done:hover .nc{filter:brightness(1.06)}
.vs{border-radius:18px;padding:14px 16px;margin:16px 0;background:var(--surface);border:2px solid var(--line);box-shadow:var(--shadow)}
.vs b{display:block;font-size:20px}
.vs span{color:var(--muted);font-size:15px}
.vs.win{border-color:var(--good)}
.vs.lose{border-color:var(--bad)}
.stars{font-size:54px;letter-spacing:6px;margin:6px 0;display:flex;justify-content:center;gap:6px}
.stars span{color:var(--line);display:inline-block}
.stars span.on{color:var(--star);animation:starIn .5s cubic-bezier(.2,1.4,.4,1) both;filter:drop-shadow(0 4px 6px rgba(242,169,0,.4))}
.meter{height:10px;border-radius:6px;background:var(--track);overflow:hidden;margin:6px 0 2px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--good),var(--accent),var(--bad))}
.row{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 12px;margin-top:12px;box-shadow:var(--shadow)}
.row .hd{display:flex;align-items:center;gap:12px}
.row .pos{font-size:28px}
.row .nm{flex:1}
.row small{display:block;color:var(--muted);font-size:14px}
.row .pt{font-size:22px;font-weight:900}
.lnk{font:inherit;background:none;border:0;color:var(--brand);font-weight:800;text-decoration:underline;padding:0;cursor:pointer}
.shr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.cf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.cf i{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
.cell.big{width:116px;height:116px;border-radius:18px}
.cell.big svg{width:100px;height:100px}
.chipx{font:inherit;color:var(--ink);cursor:pointer}
.chip.lock{opacity:.45;cursor:default;box-shadow:none;font-size:18px}
.rem{display:block;width:100%;text-align:left;font:inherit;font-size:16px;font-weight:600;color:var(--ink);cursor:pointer;background:linear-gradient(135deg,rgba(255,169,77,.22),rgba(255,107,107,.18));border:2px solid #FFA94D;border-radius:18px;padding:12px 14px;margin:0 0 4px;box-shadow:var(--shadow)}
.rem b{color:var(--brand);white-space:nowrap}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.tiles .card{margin-top:0}
.tiles .tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start}
.tile .ic{margin-bottom:10px}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.ac{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);opacity:.6}
.ac.on{opacity:1;border-color:var(--accent)}
.ac .ai{display:block;font-size:30px;line-height:1.1;margin-bottom:6px}
.ac .ai.big{font-size:30px;font-weight:900}
.ac b{display:block;font-size:16px;line-height:1.2}
.ac small{display:block;color:var(--muted);font-size:13px;line-height:1.3;margin-top:3px}
.achb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;z-index:60;background:var(--surface);color:var(--ink);border:2px solid var(--accent);border-radius:18px;padding:10px 18px 10px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 30px rgba(0,0,0,.25);animation:drop .5s cubic-bezier(.2,1.2,.4,1) both,fadeout .4s 2.8s forwards}
.achb span{font-size:32px;line-height:1}
.achb small{display:block;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.achb b{font-size:17px}
@keyframes drop{from{transform:translate(-50%,-150%)}to{transform:translate(-50%,0)}}
@keyframes fadeout{to{opacity:0}}
.chipx.dim{opacity:.45}
.ov{position:fixed;inset:0;z-index:70;background:rgba(10,14,40,.74);display:grid;place-items:center;padding:16px;overflow:auto;animation:rise .25s both}
.ovc{position:relative;background:var(--surface);color:var(--ink);border-radius:24px;padding:18px;max-width:420px;width:100%;box-shadow:var(--shadow)}
.ovc img{display:block;width:100%;height:auto;border-radius:16px;margin:10px 0;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.ovx{position:absolute;right:12px;top:12px}
.splash{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#2A35E8 0%,#5B3DF0 55%,#7A4DFF 100%);overflow:hidden;color:#fff}
.sp-logo{position:absolute;left:50%;top:50%;display:flex;align-items:center;gap:12px;font-size:60px;font-weight:900;letter-spacing:-2px;white-space:nowrap;opacity:0;transform:translate(-50%,-50%);filter:drop-shadow(0 8px 24px rgba(0,0,0,.25));animation:spPop .8s cubic-bezier(.2,1.3,.4,1) .1s both,spUp .6s cubic-bezier(.5,0,.2,1) 1.3s forwards}
.sp-logo svg{width:54px;height:54px}
.sp-tag{position:absolute;left:0;right:0;top:calc(50% + 48px);text-align:center;font-weight:700;opacity:0;animation:spTag 1.1s .6s both}
.sbrain{position:absolute;left:50%;top:57%;width:min(88vw,430px);height:auto;opacity:0;transform:translate(-50%,-50%) scale(.85);animation:spIn .6s 1.3s forwards}
.sbrain polygon{fill-opacity:0;animation:spLit .4s forwards}
.sbrain path{stroke-dasharray:1000;stroke-dashoffset:1000;animation:spDraw 1.1s 1.35s forwards}
.sp-skip{position:absolute;right:16px;top:calc(env(safe-area-inset-top,0px) + 14px);background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:14px;padding:8px 14px;font:inherit;font-weight:800;cursor:pointer}
.sp-hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);text-align:center;font-size:14px;font-weight:700;color:rgba(255,255,255,.88);opacity:0;animation:spHint .6s 1s forwards}
.splash.go{pointer-events:none;animation:spOut .9s .15s ease-in forwards}
.splash.go .sbrain{animation:spZoom 1s cubic-bezier(.7,0,.9,.5) forwards}
.splash.fast{animation-duration:.35s;animation-delay:0s}
.splash.fast .sbrain{animation-duration:.35s}

  if(okI.length>1){const fa=okI.reduce((a,k)=>tm[k]<tm[a]?k:a),sl=okI.reduce((a,k)=>tm[k]>tm[a]?k:a);rt+=` Tu acierto más rápido fue la pregunta ${fa+1} (${f1(tm[fa])} s) y el más lento, la ${sl+1} (${f1(tm[sl])} s).`}

}

function radar(){
  const cx0=170,cy0=150,R=92,n=AK.length,pt=(i,v)=>{const t=(-90+360*i/n)*Math.PI/180;return[cx0+R*v*Math.cos(t),cy0+R*v*Math.sin(t)]},f=p=>p.map(x=>x.toFixed(1)).join(",");
  let s=`<svg viewBox="0 0 340 300" class="radar" role="img" aria-label="Perfil de habilidades por área">`;
  [.33,.66,1].forEach(v=>{s+=`<polygon points="${AK.map((_,i)=>f(pt(i,v))).join(" ")}" fill="none" stroke="var(--line)" stroke-width="1.5"/>`});
  AK.forEach((k,i)=>{const[x,y]=pt(i,1),[lx,ly]=pt(i,1.4);s+=`<line x1="${cx0}" y1="${cy0}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)"/><text x="${lx.toFixed(1)}" y="${(ly+2).toFixed(1)}" class="rl">${AREAS[k].i}</text><text x="${lx.toFixed(1)}" y="${(ly+16).toFixed(1)}" class="rt2">${AREAS[k].s}</text>`});
  const vals=AK.map(k=>{const a=accOf(k);return a&&a.tot>=3?Math.max(.06,a.acc):.06});
  s+=`<polygon points="${vals.map((v,i)=>f(pt(i,v))).join(" ")}" fill="var(--brand)" fill-opacity=".22" stroke="var(--brand)" stroke-width="3" stroke-linejoin="round"/>`;
  vals.forEach((v,i)=>{const[x,y]=pt(i,v);s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="var(--brand)"/>`});
  return s+"</svg>";
}

function sortGen(n){for(let g=0;g<40;g++){const u=shuf([].concat(...[...Array(n)].map((_,c)=>[c,c,c,c]))),T=[...Array(n)].map((_,i)=>u.slice(i*4,i*4+4));T.push([],[]);if(T.some(t=>t.length&&t.every(x=>x===t[0])))continue;if(sortSolve(T))return T}return null}

function sortScreen(lv){
  const n=Math.min(7,3+Math.floor((lv-1)/3)),T0=sortGen(n)||sortGen(3);let T=T0.map(t=>t.slice()),sel=-1,hist=[];window._ss=()=>T;
  render(`<div class="bar-top"><button class="x" id="bk" aria-label="Volver">←</button><span class="ttl">Ordenar colores · ${lv}</span></div><p class="sub" style="margin:0">Toca un tubo y luego otro para pasar los colores. Deja cada tubo de un solo color.</p><div class="tubes" id="tubes"></div><div id="cmsg"></div><div class="shr" style="grid-template-columns:1fr 1fr"><button class="btn sm alt2" id="un">↶ Deshacer</button><button class="btn sm alt2" id="rs">Reiniciar</button></div>`);
  const done=()=>T.every(t=>!t.length||(t.length===4&&t.every(x=>x===t[0])));
  const paint=()=>{$("#tubes").innerHTML=T.map((t,i)=>`<button class="tube${sel===i?" sel":""}" data-i="${i}" aria-label="Tubo ${i+1}">${t.map(c=>`<i style="background:${CCOL[c]}">${CSYM[c]}</i>`).join("")}</button>`).join("");document.querySelectorAll(".tube").forEach(b=>b.onclick=()=>tap(+b.dataset.i))};
  const win=()=>{calmSave("sort",lv+1);$("#cmsg").innerHTML=`<div class="why ok"><b>¡Ordenado! 🌿</b><p>Sin prisa y muy bien.</p><button class="btn" id="cn">Siguiente nivel</button></div>`;on("#cn",()=>sortScreen(lv+1));chSay("¡Muy bien! Sin prisa 🌿","happy",2600);chDance(1,2400);sfx.chime()};
  const tap=i=>{if(done())return;if(sel<0){if(T[i].length)sel=i;paint();return}if(sel===i){sel=-1;paint();return}
    const A=T[sel],B=T[i],c=A[A.length-1];if(B.length<4&&(!B.length||B[B.length-1]===c)){hist.push(T.map(t=>t.slice()));let r=0;while(r<A.length&&A[A.length-1-r]===c)r++;for(let k=Math.min(r,4-B.length);k>0;k--)B.push(A.pop());sel=-1;paint();if(done())win()}else{sel=B.length?i:-1;paint()}};
  on("#bk",calmScreen);on("#un",()=>{if(hist.length&&!done()){T=hist.pop();sel=-1;paint()}});on("#rs",()=>{if(!done()){T=T0.map(t=>t.slice());hist=[];sel=-1;paint()}});paint()}
function calmLazo(lv){const q=tangleQ(Math.min(.95,(lv-1)*.1));

  const r={qs:[q],i:0,res:[],locked:false,flashing:false,calm:()=>{run=null;calmSave("lazo",lv+1);$("#cmsg").innerHTML=`<div class="why ok"><b>¡Desenredado! 🌿</b><p>Sin prisa y muy bien.</p><button class="btn" id="cn">Siguiente</button></div>`;on("#cn",()=>calmLazo(lv+1));chSay("¡Qué bien lo desenredaste! 🌿","happy",2600)}};
  run=r;q.ui.bind(r,q);on("#bk",()=>{run=null;calmScreen()})}
function calmCubos(lv){const q=(lv%2?cubeCountQ:cubeRotQ)(Math.min(.85,(lv-1)*.08));

  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(b.disabled)return;const ok=q.options[+b.dataset.i]===q.correct;document.querySelectorAll(".opt").forEach((x,k)=>{x.disabled=true;if(q.options[k]===q.correct)x.classList.add("good");else if(x===b)x.classList.add("bad")});
    calmSave("cubos",lv+1);$("#cmsg").innerHTML=`<div class="why ${ok?"ok":"no"}"><b>${ok?"¡Muy bien! 🌿":"Sin problema, mira esto"}</b><p>${q.why}</p><button class="btn" id="cn">Siguiente</button></div>`;on("#cn",()=>calmCubos(lv+1))});
  on("#bk",calmScreen)}
